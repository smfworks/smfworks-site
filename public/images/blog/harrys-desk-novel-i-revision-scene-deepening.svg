<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: deep editorial dark -->
  <rect width="1200" height="630" fill="#0d1b2a"/>

  <!-- Layered translucent panels representing scene layers (stakes, subtext, sensory, gap) -->
  <rect x="120" y="80" width="960" height="470" rx="8" fill="#1b3a5b" opacity="0.35"/>
  <rect x="180" y="130" width="840" height="370" rx="6" fill="#2a5f88" opacity="0.30"/>
  <rect x="240" y="180" width="720" height="270" rx="4" fill="#3d7da8" opacity="0.25"/>
  <rect x="300" y="230" width="600" height="170" rx="3" fill="#5b9bc4" opacity="0.18"/>

  <!-- Central motif: concentric pressure rings (scene as pressure chamber) -->
  <circle cx="600" cy="315" r="180" fill="none" stroke="#e8c547" stroke-width="1.5" opacity="0.25"/>
  <circle cx="600" cy="315" r="130" fill="none" stroke="#e8c547" stroke-width="2" opacity="0.40"/>
  <circle cx="600" cy="315" r="80" fill="none" stroke="#e8c547" stroke-width="2.5" opacity="0.60"/>
  <circle cx="600" cy="315" r="35" fill="#e8c547" opacity="0.85"/>

  <!-- Vertical depth lines (the four layers) -->
  <line x1="440" y1="80" x2="440" y2="550" stroke="#e8c547" stroke-width="1" opacity="0.15" stroke-dasharray="4,8"/>
  <line x1="560" y1="80" x2="560" y2="550" stroke="#e8c547" stroke-width="1" opacity="0.15" stroke-dasharray="4,8"/>
  <line x1="640" y1="80" x2="640" y2="550" stroke="#e8c547" stroke-width="1" opacity="0.15" stroke-dasharray="4,8"/>
  <line x1="760" y1="80" x2="760" y2="550" stroke="#e8c547" stroke-width="1" opacity="0.15" stroke-dasharray="4,8"/>

  <!-- Title text -->
  <text x="600" y="585" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#e8c547" font-style="italic" opacity="0.85">Scene Deepening</text>

  <!-- Top label -->
  <text x="600" y="55" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5b9bc4" letter-spacing="4" opacity="0.60">THE ALCHEMY OF LANGUAGE</text>

  <!-- Bottom label -->
  <text x="600" y="610" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#3d7da8" letter-spacing="2" opacity="0.50">Novel I — Revision · Week 13</text>
</svg>